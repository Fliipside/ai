[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flipside-ai"
version = "0.1.0"
description = "Flipside AI inference service"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "python-dotenv>=1,<2",
    "pydantic-settings>=2,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
voice-pyannote = ["pyannote.audio>=4,<5"]
voice-sherpa = ["sherpa-onnx>=1.12,<2", "soundfile>=0.12,<1"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app*"]
