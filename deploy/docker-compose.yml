# Standalone compose for the ai service, kept apart from the backend compose so it can be
# updated, restarted and inspected on its own. Copy this file to the server (for example
# ~/flipside-ai/) next to an ai.env holding GROQ_API_KEY and HF_TOKEN.
name: flipside-ai

services:
  ai-service:
    # Set AI_IMAGE to pin a commit tag (ghcr.io/fliipside/ai:<sha>) for a rollback.
    image: ${AI_IMAGE:-ghcr.io/fliipside/ai:latest}
    container_name: flipside-ai
    restart: unless-stopped
    env_file:
      - ./ai.env
    environment:
      DIARIZATION_ENGINE: pyannote
      VOICE_PRELOAD_MODELS: "true"
    volumes:
      # HF_HUB_CACHE=/models/huggingface in the image; keeps models across re-creates.
      - models:/models
    networks:
      - backend
    healthcheck:
      # The image has no curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  models:

networks:
  # The network the backend container is on, so it can call http://ai-service:8000.
  # No host port is published; check the name with `docker network ls` on the server.
  backend:
    external: true
    name: ${BACKEND_NETWORK:-flipside_default}
