name: Build, publish and deploy

# develop: tests and an image build only (nothing is published).
# main: the same checks, then the image is published to Docker Hub and deployed to the server.
on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  # One private Docker Hub repository holds every Flipside image; the tag says which service.
  # The backend uses the tag flipside-backend. Each publish overwrites this single tag.
  IMAGE: yjs0120/spring-boot-app
  TAG: flipside-ai
  # Publish and deploy only for commits that have landed on main.
  RELEASE: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          pip install ".[dev]"

      - name: Run tests
        run: python -m pytest -q tests

  build:
    needs: test
    runs-on: ubuntu-24.04-arm
    # A newer commit on the same branch replaces an unfinished build.
    concurrency:
      group: build-ai-image-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      # The exact image this run published; the deploy pulls it by digest, not by tag.
      digest: ${{ steps.publish.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: flipside-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image imports the voice engine
        # Catches wheels that install but do not load on ARM64 CPU (e.g. CUDA-linked torchaudio).
        run: |
          docker run --rm flipside-ai:ci python -c "
          import torch, torchaudio, torchcodec, pyannote.audio
          from torchcodec.decoders import AudioDecoder
          import app.main
          assert not torch.cuda.is_available()
          print(torch.__version__, torchaudio.__version__, torchcodec.__version__, pyannote.audio.__version__)"

      - name: Check this is still the newest commit on main
        id: fresh
        if: env.RELEASE == 'true'
        # The concurrency group only stops a run that is still going. A run whose tests
        # finished late would otherwise publish and deploy over a newer commit.
        # Re-running a run by hand (attempt 2 or later) is how an old version is rolled
        # back to, so that is allowed.
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$GITHUB_RUN_ATTEMPT" = "1" ] && [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::notice::main is now at $tip; skipping this older commit ($GITHUB_SHA)."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: env.RELEASE == 'true' && steps.fresh.outputs.stale != 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish image
        id: publish
        if: env.RELEASE == 'true' && steps.fresh.outputs.stale != 'true'
        # Same build as above, so every layer comes from the cache.
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha

  deploy:
    needs: build
    # No digest means the build skipped publishing (a newer commit was already on main).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.digest != ''
    runs-on: ubuntu-24.04
    # Never cancel a deploy halfway; a newer run waits for this one.
    concurrency:
      group: deploy-ai
      cancel-in-progress: false
    env:
      TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check this is still the newest commit on main
        id: fresh
        # Checked again here, inside the deploy queue: a newer commit may have landed
        # while this run was building or waiting for another deploy.
        # Re-running a run by hand (attempt 2 or later) is how an old version is rolled
        # back to, so that is allowed.
        run: |
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$GITHUB_RUN_ATTEMPT" = "1" ] && [ "$tip" != "$GITHUB_SHA" ]; then
            echo "::notice::main is now at $tip; skipping this older commit ($GITHUB_SHA)."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.fresh.outputs.stale != 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          # The server's public host key as known_hosts lines, checked by hand once.
          # ssh-keyscan at deploy time would trust whichever machine answers, and
          # ai.env (API keys) is sent over this connection.
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::Secret SSH_KNOWN_HOSTS is empty. Add the server's host key (see README)."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host *\n  IdentityFile ~/.ssh/id_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' > ~/.ssh/config

      - name: Copy compose file and secrets to the server
        if: steps.fresh.outputs.stale != 'true'
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          ssh "$TARGET" 'mkdir -p ~/flipside-ai'
          scp deploy/docker-compose.yml "$TARGET:flipside-ai/docker-compose.yml"
          # Sent over stdin so the values never appear in a command line.
          printf '%s\n' "$ENV_FILE" | ssh "$TARGET" 'umask 077 && cat > ~/flipside-ai/ai.env'

      - name: Deploy to server
        if: steps.fresh.outputs.stale != 'true'
        # The image is private. The server is already logged in to Docker Hub, the same
        # login the backend deploy pulls with, so no credentials are sent here.
        # The image is named by digest: the tag is shared, and another run may have
        # overwritten it since this run published.
        env:
          AI_IMAGE: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
        run: ssh "$TARGET" "AI_IMAGE='$AI_IMAGE' bash -s" < deploy/deploy.sh
